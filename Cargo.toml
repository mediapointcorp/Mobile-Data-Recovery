[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/carve",
    "crates/validate",
    "crates/fs",
    "crates/worker",
    "crates/testkit",
    "crates/bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/mediapointcorp/Mobile-Data-Recovery"

[workspace.dependencies]
pr-model = { path = "crates/model" }
pr-carve = { path = "crates/carve" }
pr-validate = { path = "crates/validate" }
pr-fs = { path = "crates/fs" }
pr-testkit = { path = "crates/testkit" }

anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.5"
hex = "0.4.3"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
jpeg-encoder = "0.7"
kamadak-exif = "0.6.1"
memchr = "2.7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3.41", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1.17", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
